<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Selection on the current score, and validity under rising agent share</title>
<desc id="svgdesc">Left: the validity slope and correlation of the change statistic against the true state, under four criterion schedules -- all days, a schedule triggered on the current score, a current-score-only control, and inverse-probability weighting on a mixed schedule -- with bootstrap intervals. Right: the predicted (formula) versus realized (simulated) attenuation ratio for indicators 4 and 5 when the agent-authored share rises with the state, raw and after authorship filtering.</desc>
