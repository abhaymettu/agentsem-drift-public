<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Detecting a planted drift: sensitivity vs. false flags</title>
<desc id="svgdesc">Sensitivity within 21 days of a planted drift's onset against false flags per tracked person-month, swept over the detection threshold, for the fixed-baseline and naive architectures. Shaded bands are bootstrap intervals on sensitivity. Diamonds mark each architecture's chance baseline at its own realized false-flag rate.</desc>
